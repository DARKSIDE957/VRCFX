<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRCFX</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Instant Theme Bootstrap -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('vrcfx-theme') || 'pitch-black';
          document.documentElement.className = 'theme-' + theme;
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
    <!-- Google Fonts including Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased overflow-hidden select-none font-sans bg-app text-theme-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
